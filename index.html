    1: { title:"Hardware/Rates Shock", narrative:"*Even before your first rebalance, a shock hits.* A surprise spike in short-term funding costs ripples through the repo market right as the recession bites. Everyone is repricing risk at once.", choices:[

// --- Situational (triggered) events: fire only if the player's own allocation choices meet a condition ---

const TN = {
    mpt: { title: "Modern Portfolio Theory & Constraints", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 2; Bodie, Kane & Marcus (2023), Chapters 6-7.<br><br>Construct an efficient portfolio. Weights must sum to exactly 100%. Factor tilts (Value, Small-cap) are constrained to <b>±15%</b> to prevent uncompensated idiosyncratic risk and excessive tracking error. Diversification eliminates firm-specific risk, but systematic risk remains." },
    tilts: { title: "Factor Tilts & Tracking Error", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 4 (Multifactor Models); Bodie, Kane & Marcus (2023), Chapter 10.<br><br>A 'tilt' is an intentional overweight/underweight relative to a benchmark to capture a risk premium (e.g., SMB, HML). Unconstrained tilts lead to massive tracking error. Industry practice bounds active weights." },
    duration: { title: "Duration & Yield Curve", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 8 (Fixed Income Portfolio Management).<br><br>Duration measures interest rate sensitivity. In expansion with rising yields, long-duration bonds suffer capital losses. Shortening duration protects against parallel upward shifts in the yield curve." },
    active: { title: "Active Share & Late-Cycle Positioning", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 9 (Active Portfolio Management); Bodie, Kane & Marcus (2023), Chapter 27.<br><br>Active Share measures the percentage differing from the benchmark. High Active Share + High Tracking Error = High Conviction. Avoid 'closet indexing'." },
    timing: { title: "Market Timing Models (Treynor-Mazuy)", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 9; Bodie, Kane & Marcus (2023), Chapter 24.<br><br>The Treynor-Mazuy model tests market timing by adding a squared market excess return term: $R_p - R_f = \\alpha + b(R_M - R_f) + c(R_M - R_f)^2 + e$. A statistically significant positive 'c' indicates successful market timing (convex payoff), as the manager increases beta in up markets and decreases it in down markets." },
    mayers: { title: "Mayers (1972) CAPM Extension", text: "<b>Source:</b> Bodie, Kane & Marcus (2023), Chapter 9; FN3204 Subject Guide, Chapter 3.<br><br>Mayers extended the CAPM to include non-traded assets like human capital. The primary empirical implication is that the empirical SML will be flatter than the simple CAPM predicts, because the traded index is an inefficient proxy for the true market portfolio (which includes human capital)." },
    ff5: { title: "Fama-French 5-Factor Model", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 4; Bodie, Kane & Marcus (2023), Chapter 13.<br><br>In 2015, Fama and French augmented their 3-factor model by adding two factors: RMW (Robust Minus Weak profitability) and CMA (Conservative Minus Aggressive investment). These capture the observation that firms with high operating profitability and low investment tend to have higher average returns." },
    single_stock_alpha: { title: "Statistical Power in Single-Stock Regressions", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3; Bodie, Kane & Marcus (2023), Chapter 13.<br><br>Individual stocks have high firm-specific variance (idiosyncratic risk), which leads to large standard errors for the estimated alpha. This reduces statistical power, making it difficult to reject the null hypothesis of zero alpha even if the stock is consistently mispriced. This is why empirical tests use portfolios of stocks." },
    style: { title: "Style Analysis & R-Squared", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 9; Bodie, Kane & Marcus (2023), Chapter 24.<br><br>Style analysis regresses a fund's returns on passive style indices. A high R-squared (e.g., >90%) indicates that the fund's returns are almost entirely explained by its passive style exposures, suggesting little to no active stock-picking skill (alpha)." },
    liquidity: { title: "Liquidity Premium (Acharya-Pedersen)", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3 (Empirical Evidence); Bodie, Kane & Marcus (2023), Chapter 13.<br><br>Acharya and Pedersen (2005) extended the CAPM for liquidity. Expected return increases to compensate for both the illiquidity level of the asset and its covariance with market-wide liquidity shocks. Illiquid assets are riskier, not safer." },
    attenuation: { title: "Errors-in-Variables & Attenuation Bias", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3; Bodie, Kane & Marcus (2023), Chapter 13.<br><br>In the two-pass CAPM test, estimated betas from the first pass are used as the independent variable in the second pass. Because these betas contain measurement error, it introduces an 'errors-in-variables' problem, causing attenuation bias. This biases the estimated SML slope toward zero, making it appear flatter than it truly is." },
    fama_macbeth: { title: "Fama-MacBeth Procedure Advantage", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3; Bodie, Kane & Marcus (2023), Chapter 13.<br><br>The key methodological advantage is that it runs cross-sectional regressions for each time period, then averages the coefficients over time. This accounts for time-variation in risk premiums and betas, yielding more robust t-statistics than a single-period two-pass regression." },
    joint_hypothesis: { title: "The Joint Hypothesis Problem", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 5 (Market Efficiency); Bodie, Kane & Marcus (2023), Chapter 11.<br><br>Fama (1991) articulated that any test of market efficiency is simultaneously a test of the asset pricing model used to define 'normal' expected returns. An observed anomaly could mean the market is inefficient, or simply that the pricing model is misspecified." },
    flat_sml: { title: "Empirical SML: The Low-Beta Anomaly", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3; Bodie, Kane & Marcus (2023), Chapter 13.<br><br>Empirical tests often find a positive intercept ($\\gamma_0 > 0$) and a slope ($\\gamma_1$) that is positive but much flatter than the historical market risk premium. This contradicts CAPM predictions and implies that low-beta stocks earn more than predicted, while high-beta stocks earn less." },
    closet_indexing: { title: "Closet Indexing & Active Share", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 9; Bodie, Kane & Marcus (2023), Chapter 24.<br><br>'Closet indexing' occurs when a fund charges active management fees but maintains a very low Active Share (e.g., < 60%) and low Tracking Error, effectively mimicking the benchmark while charging higher fees." },
    ethics: { title: "CFA Code of Ethics: Material Non-Public Information", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 1 & Chapter 28 (Investment Policy and CFA Framework).<br><br>CFA Standard II(A) prohibits the use of Material Non-Public Information (MNPI). Possessing such information creates a conflict of interest. The correct action is to refuse the information and the associated trade flow direction entirely." },
    sim_estimates: { title: "Estimation Burden: Full Covariance vs. Single Index Model", text: "<b>Source:</b> FN3204 Subject Guide, Chapter 3; Bodie, Kane & Marcus (2023), Chapter 8 (Index Models).<br><br>The Markowitz full-covariance model requires estimating expected returns (n), variances (n), and unique covariances (n(n-1)/2), totaling <b>n(n+3)/2</b> estimates. For N=100, this is 5,150 estimates.<br><br>The Single Index Model (SIM) drastically reduces this by attributing all covariance to a common market factor. It requires estimating alpha (n), beta (n), and firm-specific variance (n) for each stock, plus the market risk premium (1) and market variance (1), totaling <b>3n + 2</b> estimates. For N=100, this is only 302 estimates." }
};

{type:'name',title:"Day One",narrative:"You push through the revolving doors of IPM Capital. The trading floor hums with quiet intensity. Before you can even unpack, <strong>Marcus</strong>, a Senior PM who just passed CFA Level III, slides a black coffee onto your desk.\n\n<i>\"Let's see if you actually understand what 'risk' means. Enter your name to begin.\"</i>"},

{type:'dialog',title:"First Impressions",speaker:"Marcus",avatar:AVATARS.marcus,narrative:"*Marcus leans back, not looking up from his Bloomberg terminal.*\n\n\"In that show you probably watch, they talk about the 'bird in the egg' and portfolio variance. Even the hotshots mess up the two-asset formula by ignoring correlation. Let's see if you can move beyond the meme.\""},

options:[
{text:"60% in Asset A; the portfolio variance is minimized but retains a small amount of idiosyncratic risk because no real-world portfolio is perfectly riskless.",correct:false,feedback:"You are letting real-world cynicism override the mathematical constraints. With ρ = -1, the assets move in perfect opposition. The formula yields 60%, and total variance hits absolute zero. Idiosyncratic risk is irrelevant here."},
{text:"40% in Asset A; the portfolio variance is exactly zero, as the lower volatility asset requires a lower weight to balance the risk.",correct:false,feedback:"You inverted the intuition. To balance the risk, the higher volatility asset (B) needs the lower weight. The formula assigns the higher weight to the lower volatility asset: 30 / (20 + 30) = 60% in A."},
{text:"60% in Asset A; the portfolio variance is exactly zero, creating a perfectly riskless hedge.",correct:true,feedback:"Correct. w_A = 30/(20+30) = 0.60. With ρ = -1, you can construct a riskless portfolio. You might survive here."}]},

{text:"E(R_B) = 11.2%; Asset A plots on the SML because the market is in equilibrium and all assets must be fairly priced by definition.",correct:false,feedback:"Equilibrium is the theory, but the problem gives you an actual return of 10% while CAPM predicts 9.4%. The market isn't perfectly efficient here; A is generating positive alpha. Also, 1.4 × 8% = 11.2% is the risk premium; you forgot to add the 3% risk-free rate."},
{text:"E(R_B) = 14.2%; Asset A plots above the SML, indicating it is generating a positive alpha of 0.6%.",correct:true,feedback:"Correct. E(R_B) = 3% + 1.4×8% = 14.2%. For A, CAPM predicts 9.4%. Since actual 10% > 9.4%, it has positive alpha and plots above the SML."}]},

narrative:"\"Before we begin,\" *Eleanor taps the IPS,* \"prove you understand constraints. My target expected return is 8.0%. Asset X (Equity) has E[R]=10%, σ=20%. Asset Y (Bonds) has E[R]=6%, σ=10%. Correlation 0.5. How do you construct this portfolio?\"",

{text:"66.7% X and 33.3% Y; this minimizes the portfolio variance while achieving an expected return above the 8% target to provide a safety buffer for the pension fund.",correct:false,feedback:"Eleanor's IPS strictly mandates an 8.0% target. Over-delivering violates the constraint and forces the portfolio to take on unnecessary variance. Read the IPS carefully."},
{text:"50% X and 50% Y; this exactly meets the 8% target constraint, allowing the optimization algorithm to focus purely on minimizing variance.",correct:true,feedback:"Precisely. E[R] = 0.5(10%) + 0.5(6%) = 8%. This meets my target constraint, allowing the optimization to focus purely on minimizing variance."},
{text:"40% X and 60% Y; this guarantees the 8% target is met even if Asset X underperforms, prioritizing capital preservation over exact targeting.",correct:false,feedback:"You are guessing weights based on 'safety' without doing the math. 0.4(10%) + 0.6(6%) = 7.6%. You missed the 8% target entirely."}]},

options:[
{text:"0.09, because in the Single Index Model, a high beta (>1) implies that the firm-specific variance is equal to the systematic variance.",correct:false,feedback:"0.09 is the systematic variance (β²σ²_M = 1.5² × 0.04). A high beta just means high systematic risk, not that the two variances are equal. Total variance is the sum of both. You calculated the wrong half of the equation."},
{text:"0.11, calculated by adding the market variance (0.04) to the beta-squared penalty (0.07) to account for the stock's high volatility.",correct:false,feedback:"Total variance is given as 0.15. You cannot just add market variance and a beta penalty; you must subtract the systematic portion (β²σ²_M) from the total variance to isolate the firm-specific portion."},
{text:"0.06, derived by subtracting the systematic variance (β²σ²_M = 0.09) from the total variance (0.15).",correct:true,feedback:"Exactly! Systematic = 2.25 × 0.04 = 0.09. Firm-specific = 0.15 - 0.09 = 0.06. Thanks, I owe you lunch!"}]},

{type:'email',title:"CAPM Testing Literature",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Roll's Critique",
narrative:"As we prepare the quarterly report, remember the limitations of our benchmark. According to Richard Roll's 1977 critique, why is the CAPM fundamentally untestable in practice?",
options:[
{text:"Beta estimates are highly unstable and subject to structural breaks, meaning the SML cannot be reliably tested over long horizons without adjusting for time-varying risk.",correct:false,feedback:"You are confusing practical econometric issues with theoretical critiques. Roll's argument is much deeper: it is about the impossibility of observing the true market portfolio, not just measurement error."},
{text:"The true market portfolio, encompassing all risky assets (including human capital and real estate), is unobservable, meaning we can only test the efficiency of our proxy, not the CAPM itself.",correct:true,feedback:"Correct. Without the true market portfolio, we can only test the efficiency of the proxy, not the CAPM itself."},
{text:"The CAPM assumes investors can borrow and lend at the risk-free rate, which is empirically false due to credit spreads and inflation risk, invalidating the SML.",correct:false,feedback:"While true in practice, this is a critique of the assumptions, not Roll's Critique. Roll specifically targeted the unobservability of the market portfolio."}]},

{type:'email',title:"Methodology Check",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Fama-MacBeth Methodology",
narrative:"When testing the CAPM, why did Fama and MacBeth (1973) recommend forming portfolios of stocks grouped by beta for the second-pass cross-sectional regression, rather than using individual stocks?",
options:[
{text:"It guarantees that the second-pass regression will yield a statistically significant positive alpha, proving that the market is inefficient and rewarding active management.",correct:false,feedback:"No methodology can guarantee a theoretical result like positive alpha. Fama-MacBeth improves statistical power and reduces measurement error; it doesn't rig the game to find inefficiencies."},
{text:"It eliminates the need to estimate betas in the first pass by using accounting fundamentals as the independent variables in the second pass, avoiding look-ahead bias.",correct:false,feedback:"Fama-MacBeth still uses betas (or factor loadings) from the first pass. The innovation is in grouping them to reduce measurement error, not replacing them with fundamentals."},
{text:"It reduces the errors-in-variables problem by diversifying away firm-specific noise in the first pass, leading to more robust cross-sectional inference in the second pass.",correct:true,feedback:"Correct. Grouping into portfolios diversifies away firm-specific noise, reducing attenuation bias in the second pass."}]},

{type:'quiz',title:"Coffee Machine Chat",speaker:"Ben",avatar:AVATARS.ben,
narrative:"*Ben is waiting for his espresso, holding a printed research paper.*\n\n\"I'm reading the 1992 Journal of Finance paper. Fama and French noted that size and beta are correlated. How did they isolate the size effect from the beta effect in their empirical tests?\"",
options:[
{text:"They ran a simple univariate regression of returns on market capitalization, arguing that beta is just a proxy for size and doesn't need to be controlled for separately.",correct:false,feedback:"A simple univariate regression would suffer from omitted variable bias due to the correlation between size and beta. You cannot just ignore one of the variables."},
{text:"They excluded all stocks with a beta greater than 1.0 to create a homogeneous sample, ensuring that the size effect wasn't contaminated by high-beta tech stocks.",correct:false,feedback:"They did not exclude high-beta stocks; they controlled for beta using a specific sorting methodology to keep the data intact."},
{text:"They used a double-sorting procedure: first into size deciles, then within each decile by beta, to isolate the effects.",correct:true,feedback:"Exactly. This allowed them to examine the effect of beta while holding size constant, and vice versa. Smart, right?"}]},

{type:'email',title:"Covariance Matrix",speaker:"Risk Management",from:"Risk Management <risk@ipmcapital.com>",avatar:AVATARS.thorne,subject:"SIM Covariance Calculation",
narrative:"One of the main advantages of the Single Index Model is the reduction in estimates. In the SIM, how is the covariance between two distinct stocks i and j calculated?",
options:[
{text:"Cov(R_i, R_j) = σ_i × σ_j × ρ_ij, because this is the universal definition of covariance and the SIM doesn't change the fundamental math of asset co-movement.",correct:false,feedback:"While true generally, the Single Index Model makes a specific assumption about firm-specific returns (that they are uncorrelated). This assumption simplifies the general formula."},
{text:"Cov(R_i, R_j) = β_i × β_j × σ²_M, as the model assumes zero correlation in firm-specific returns, meaning stocks only co-move because of their common exposure to the market factor.",correct:true,feedback:"Correct. Stocks only co-move because of their common exposure to the market factor."},
{text:"Cov(R_i, R_j) = β_i + β_j, reflecting the additive nature of factor exposures in a multi-asset portfolio.",correct:false,feedback:"Covariance is a multiplicative relationship involving variance, not additive."}]},

{type:'email',title:"Portfolio Theory",speaker:"Marcus",from:"Marcus <marcus.pm@ipmcapital.com>",avatar:AVATARS.marcus,subject:"Tangency Portfolio",
narrative:"When a risk-free asset is introduced to the efficient frontier, the new efficient frontier becomes a straight line. What is this line called, and what portfolio lies at the tangency point?",

{text:"Capital Allocation Line or Capital Market Line; the Tangency Portfolio, which maximizes the Sharpe ratio.",correct:true,feedback:"Correct. The tangency portfolio offers the highest reward-to-volatility ratio."},
{text:"Characteristic Line; the Market Portfolio.",correct:false,feedback:"The Characteristic Line is the regression line of a stock's excess returns on the market's."}]},

{type:'email',title:"APT Calculation",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Arbitrage Pricing Theory",
narrative:"Let's test your APT. Two independent factors F1 and F2. Risk-free rate is 6%. Portfolio P has β_1 = 1.5 and β_2 = -0.5. Risk premiums: F1 = 8%, F2 = 4%. What is E(R_P)?",
options:[
{text:"14%, calculated by ignoring the risk-free rate and only summing the factor risk premiums, as APT is a relative pricing model.",correct:false,feedback:"The APT formula is E(R) = Rf + β1RP1 + β2RP2. APT is an absolute pricing model; you must include the risk-free rate."},
{text:"16%, calculated as R_f + (β_1 × RP_1) + (β_2 × RP_2), properly accounting for the negative beta.",correct:true,feedback:"Correct. E(R_P) = 6% + (1.5×8%) + (-0.5×4%) = 6% + 12% - 2% = 16%."},
{text:"20%, calculated by adding the absolute values of the factor risk premiums to the risk-free rate to account for the volatility of both factors.",correct:false,feedback:"Pay close attention to the sign of the second beta. A negative factor loading reduces the required return, it does not add to it."}]},

{type:'email',title:"Market Timing",speaker:"Sarah",from:"Sarah <sarah.macro@ipmcapital.com>",avatar:AVATARS.sarah,subject:"Treynor-Mazuy Model",theoryKey:'timing',
narrative:"We're evaluating a manager's timing ability using the Treynor-Mazuy model: R_p - R_f = α + b(R_M - R_f) + c(R_M - R_f)² + e. What does a statistically significant positive 'c' indicate?",
options:[
{text:"Poor market timing, as the squared term implies the manager is taking on excessive non-linear tail risk, creating a concave payoff profile that destroys value.",correct:false,feedback:"A negative 'c' indicates poor timing (concave payoff). A positive 'c' means the manager successfully increases beta in up markets and decreases it in down markets."},
{text:"The portfolio has a high Information Ratio due to non-linear payoffs, indicating the manager is being compensated for taking on options-like tail risk.",correct:false,feedback:"The 'c' coefficient specifically measures timing ability (market direction), not the Information Ratio (which measures residual return per unit of residual risk)."},
{text:"Successful market timing, as the manager dynamically increases portfolio beta when the market rises and decreases it when the market falls, creating a convex payoff.",correct:true,feedback:"Sharp. A positive 'c' creates a convex payoff profile, indicating successful timing."}]},

{type:'email',title:"Performance Metric",speaker:"Marcus",from:"Marcus <marcus.pm@ipmcapital.com>",avatar:AVATARS.marcus,subject:"Sub-Portfolio Evaluation",
narrative:"When evaluating a well-diversified sub-portfolio that will be mixed with a broader market index, which performance metric is most appropriate?",
options:[
{text:"Sharpe Ratio, because it penalizes all volatility equally, ensuring the sub-portfolio isn't taking on hidden risks that could blow up the master fund.",correct:false,feedback:"Sharpe penalizes upside volatility and firm-specific risk, which is irrelevant for a diversified sub-portfolio added to a master fund."},
{text:"Jensen's Alpha alone, without considering risk, because the ultimate goal of the sub-portfolio is to generate absolute returns for the pension fund.",correct:false,feedback:"Alpha alone doesn't tell you the risk taken to achieve it."},
{text:"Information Ratio or Treynor Ratio, because the relevant risk is systematic or residual risk, not total volatility.",correct:true,feedback:"Correct. For a sub-portfolio added to a diversified master, we care about alpha per unit of non-diversified risk."}]},

{type:'dialog',title:"Coffee Break Complaint",speaker:"Ben",avatar:AVATARS.ben,theoryKey:'sim_estimates',
narrative:"*Ben slumps into the chair next to you, rubbing his temples.*\n\n\"Marcus won't stop bragging about passing CFA Level 3. Meanwhile, I'm drowning in Level 1 prep. He mentioned the Single Index Model is a total lifesaver for estimation. Something about only needing $3N + 2$ estimates instead of the full covariance matrix's $N(N+3)/2$. For 100 stocks, that's a massive difference in workload. I just hope I remember the exact numbers for the exam...\""},

{type:'email',title:"System Requirements",speaker:"IT & Quant",from:"IT & Quant <itsupport@ipmcapital.com>",avatar:AVATARS.thorne,subject:"SIM Estimation Burden",
narrative:"For N = 100 stocks, how many estimates does the full covariance model need versus the Single Index Model?",
options:[
{text:"Full: 4,950. SIM: 200, because the SIM only requires estimating the alpha and beta for each stock, ignoring residual variance since it's diversifiable.",correct:false,feedback:"You still need to estimate residual variance for the SIM! The formula is 3N + 2. For N=100, that's 302, not 200. You cannot ignore the error term."},
{text:"Full: 5,150. SIM: 302, because the full model requires N(N+3)/2 estimates, while the SIM only requires 3N + 2 parameters (alpha, beta, residual variance per stock, plus market mean and variance).",correct:true,feedback:"Correct. The full covariance model requires n(n+3)/2 = 5,150 estimates. The SIM requires only 3n + 2 = 302 estimates, drastically reducing the data burden."},
{text:"Full: 10,000. SIM: 300, because the full model requires N^2 covariance estimates, and the SIM requires exactly 3 estimates per stock.",correct:false,feedback:"The covariance matrix is symmetric, so you don't need N^2 estimates. You need N(N+1)/2 for variances/covariances, plus N for means. Total N(N+3)/2."}]},

{type:'dialog',title:"Elevator Ride",speaker:"Dr. Aris Thorne",avatar:AVATARS.thorne,theoryKey:'mayers',
narrative:"*You step into the elevator with Dr. Thorne. He doesn't look up from his tablet.*\n\n\"Mayers' 1972 extension to the CAPM is a favorite of mine. By including non-traded assets like human capital, the empirical SML inevitably becomes flatter than the simple CAPM predicts. Why? Because the traded index we use is an inefficient proxy for the true market portfolio. Keep that in mind for the next compliance check.\""},

{type:'email',title:"Human Capital",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Mayers (1972) Extension",
narrative:"Mayers extended the CAPM to include non-traded assets like human capital. What is the primary empirical implication for the SML?",
options:[
{text:"The SML becomes steeper, as human capital acts as a leveraged bet on the market, increasing the overall systematic risk premium required by investors to hold equities.",correct:false,feedback:"Because human capital is untraded, it makes the observed market proxy inefficient. This biases betas and flattens the empirical SML, it does not make it steeper."},
{text:"The empirical SML will be flatter than the simple CAPM predicts, because the traded equity index is an inefficient proxy for the true market portfolio, which includes human capital.",correct:true,feedback:"Correct. The wedge between the traded index and the true market portfolio biases beta estimates and flattens the SML."},
{text:"The SML shifts vertically, as human capital has a zero beta but a positive expected return, creating a new intercept that is independent of market risk.",correct:false,feedback:"The inclusion of non-traded assets fundamentally alters the slope by introducing a wedge between the true market and the observed proxy, it does not just shift the intercept."}]},

{text:"RMW (Robust Minus Weak profitability) and CMA (Conservative Minus Aggressive investment), capturing the tendency for firms with high operating profitability and low investment to outperform.",correct:true,feedback:"Exactly. High profitability and low investment firms tend to outperform. Thanks, I'm gonna pass this exam!"},
{text:"MACRO (GDP growth surprises) and DEF (Default risk spreads), based on the Chen, Roll, and Ross macroeconomic factor model.",correct:false,feedback:"Those are macroeconomic factors. Fama-French are strictly firm-level characteristic factors. Remember the acronyms: RMW and CMA."}]},

{type:'email',title:"Statistical Power",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Single Stock Alpha",theoryKey:'single_stock_alpha',
narrative:"Why might a single stock's time-series regression yield insignificant alpha, even if the stock is consistently mispriced?",
options:[
{text:"CAPM requires alpha to be exactly 1.0.",correct:false,feedback:"CAPM requires alpha to be exactly 0.0 in equilibrium."},
{text:"High firm-specific variance leads to large standard errors, reducing statistical power.",correct:true,feedback:"Correct. Individual stocks are noisy. This is why we test using portfolios."},
{text:"Market returns are perfectly normally distributed.",correct:false,feedback:"The primary reason is high idiosyncratic volatility, which inflates the standard error of the alpha estimate."}]},

{type:'email',title:"APT Core",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"No-Arbitrage Assumption",

{type:'email',title:"Liquidity Premium",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Acharya-Pedersen (2005)",theoryKey:'liquidity',
narrative:"Acharya and Pedersen extended the CAPM for liquidity. How does this affect the expected return of an illiquid asset?",
options:[
{text:"Expected return decreases because illiquid assets are considered 'safer' havens during market stress.",correct:false,feedback:"Illiquid assets are riskier, not safer. Investors demand a premium to hold them."},
{text:"No effect on expected return; liquidity risk is purely idiosyncratic and can be fully diversified away.",correct:false,feedback:"Market-wide liquidity is a systematic risk factor. It cannot be diversified away."},
{text:"Expected return increases to compensate for both the asset's illiquidity level and its covariance with market-wide liquidity shocks.",correct:true,feedback:"Correct. Investors demand a premium for illiquidity and for assets that become illiquid during market stress."}]},

{type:'dialog',title:"Printer Room Chat",speaker:"Dr. Aris Thorne",avatar:AVATARS.thorne,theoryKey:'attenuation',
narrative:"*Dr. Thorne is waiting for a document to print.*\n\n\"When we use estimated betas from the first pass as independent variables in the second pass, we introduce measurement error. This causes 'attenuation bias', biasing the SML slope toward zero. It makes the empirical SML look flatter than it truly is. A classic econometrics trap. Don't let it catch you off guard.\""},

{type:'email',title:"Attenuation Bias",speaker:"Dr. Aris Thorne",from:"Dr. Aris Thorne <aris.thorne@ipmcapital.com>",avatar:AVATARS.thorne,subject:"Two-Pass Regression",
narrative:"In the two-pass CAPM test, we use estimated betas from the first pass as the independent variable in the second pass. What statistical problem does this introduce?",
options:[
{text:"Heteroskedasticity, which inflates the standard errors of the alpha estimates, making the SML appear steeper than it truly is.",correct:false,feedback:"Heteroskedasticity is about non-constant variance of the error term. The issue here is measurement error in the independent variable (beta), which causes attenuation bias (slope biased toward zero)."},
{text:"The errors-in-variables problem, causing attenuation bias — the estimated slope of the SML is biased toward zero, making it appear flatter than the theoretical CAPM predicts.",correct:true,feedback:"Correct. Measurement error in beta makes the SML appear flatter than it truly is."},
{text:"Perfect multicollinearity, making the second-pass regression mathematically unsolvable because beta is perfectly correlated with the market risk premium.",correct:false,feedback:"Multicollinearity occurs when independent variables are correlated with each other. Here, the issue is that the independent variable (beta) is measured with error."}]},

{type:'quiz',title:"Elevator Ride",speaker:"Ben",avatar:AVATARS.ben,
narrative:"*You're waiting for the elevator. Ben rushes over, holding a coffee.*\n\n\"Quick question before the board meeting! As N approaches infinity in an equally weighted portfolio, what happens to total variance under the Single Index Model? I need to know the diversification limit.\"",
options:[
{text:"Converges to zero, eliminating all risk.",correct:false,feedback:"Only firm-specific risk converges to zero. Systematic risk remains as the floor."},

function startGame(){
const name=document.getElementById('studentNameInput').value.trim();
if(!name){alert("Please enter your name.");return;}
state.studentName=name;
state.playerEmail=name.toLowerCase().replace(/\s+/g,'.')+'@ipmcapital.com';
// Randomize replayability: pick 2 of the 4 quarters to carry a systemic market event, and randomize the situational-event trigger thresholds
const pool=[1,2,3,4];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
state.activeEventQuarters=pool.slice(0,2);
const rand=(min,max)=>Math.round((min+Math.random()*(max-min))*10)/10;
state.sitThresholds={closetTilt:rand(4,10),marginBeta:rand(1.2,1.4),marginCapital:Math.round(rand(8.5,9.5)*1000000)};
nextScene();}

function openTheoryNote(k){const n=TN[k];document.getElementById('modal-title').innerText=n.title;document.getElementById('modal-text').innerHTML=n.text;document.getElementById('theory-modal').classList.add('active');}
function closeModal(){document.getElementById('theory-modal').classList.remove('active');}
function updateAlloc(el){state.alloc[el.dataset.k]=parseInt(el.value);document.getElementById('v_'+el.dataset.k).innerText=el.value+'%';updateAllocSum();updateRiskDashboard();}
function computeRisk(){
const beta=KEYS.reduce((s,k)=>s+(state.alloc[k]/100)*AP[k].beta,0);
const activeShare=KEYS.reduce((s,k)=>s+Math.abs(state.alloc[k]-BENCH[k]),0)/2;
const teProxy=activeShare*0.3;
return {beta,activeShare,teProxy,valTilt:state.alloc.val,smallTilt:state.alloc.small};}
function riskBadge(ok,warnTxt,okTxt){return ok?`<span class="text-green-400">${okTxt}</span>`:`<span class="text-red-400">${warnTxt}</span>`;}
function updateRiskDashboard(){
const el=document.getElementById('riskDash');if(!el)return;
const r=computeRisk();
const betaWarn=r.beta>1.3;
const closetWarn=(r.valTilt+r.smallTilt)<=10;
const tiltWarn=r.valTilt>15||r.smallTilt>15;
el.innerHTML=`<div class="p-4 bg-slate-900/60 border border-slate-700 rounded-lg">
<div class="text-xs uppercase tracking-wide text-slate-500 mb-3 font-bold">📊 Live Risk Dashboard</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
<div><div class="text-slate-500 text-xs">Portfolio Beta</div><div class="mono font-bold ${betaWarn?'text-red-400':'text-blue-300'}">${r.beta.toFixed(2)}</div></div>
<div><div class="text-slate-500 text-xs">Active Share (proxy)</div><div class="mono font-bold ${closetWarn?'text-amber-400':'text-blue-300'}">${r.activeShare.toFixed(0)}%</div></div>
<div><div class="text-slate-500 text-xs">Tracking Error (proxy)</div><div class="mono font-bold text-blue-300">${r.teProxy.toFixed(1)}%</div></div>
<div><div class="text-slate-500 text-xs">Factor Tilts (Val/Small)</div><div class="mono font-bold ${tiltWarn?'text-red-400':'text-blue-300'}">${r.valTilt}% / ${r.smallTilt}%</div></div>
</div>
<div class="text-xs text-slate-500 mt-3 space-y-1">
${betaWarn?'<div class="text-red-400">⚠ Beta above 1.3 — elevated systematic risk, watch for margin calls.</div>':''}
${closetWarn?'<div class="text-amber-400">⚠ Very low active tilts — risk of "closet indexing" (charging active fees, running a near-benchmark book).</div>':''}
${tiltWarn?'<div class="text-red-400">⚠ A factor tilt exceeds the ±15% compliance limit.</div>':''}
${!betaWarn&&!closetWarn&&!tiltWarn?'<div class="text-slate-500">All metrics within a reasonable active-management range.</div>':''}
</div>
<div class="text-[10px] text-slate-600 mt-2 italic">Illustrative approximations vs. a simple benchmark, for teaching purposes only — not the exact FN3204 formulas.</div>
</div>`;}
function updateAllocSum(){const s=KEYS.reduce((a,k)=>a+state.alloc[k],0);const el=document.getElementById('allocSum');el.innerText=`Sum: ${s}% ${s===100?'✅':'️ Must be 100%'}`;el.className=`text-sm font-bold mt-4 ${s===100?'text-green-400':'text-red-400'}`;}
function confirmAlloc(){
const s=KEYS.reduce((a,k)=>a+state.alloc[k],0);if(s!==100){alert("Weights must sum to exactly 100%.");return;}
if(state.alloc.val>15||state.alloc.small>15){alert("Compliance Block: Factor tilts cannot exceed 15%.");return;}
if((state.alloc.tb+state.alloc.bond)<10){alert("IPS Breach: The pension mandate requires at least 10% held in Cash (T-Bills) and/or Government Bonds as a liquidity buffer for payouts.");return;}
const scene=scenes[state.sceneIndex];
const trig=checkSituational(scene.quarter);
if(trig){renderSituationalEvent(trig);return;}
nextScene();}

function handleSysEvent(q,idx){
const ev=SYS_EVENTS[q];const scenCopy=Object.assign({},SCEN[q]);ev.choices[idx].apply(scenCopy);state.eventScen[q]=scenCopy;nextScene();}

function checkSituational(q){
if(q>=2 && !state.triggeredSituational.closet){
    const tiltActivity=state.alloc.val+state.alloc.small;
    if(tiltActivity<=state.sitThresholds.closetTilt){state.triggeredSituational.closet=true;return 'closet';}
}
if(q>=2 && !state.triggeredSituational.margin){
    const beta=(state.alloc.mkt+state.alloc.val+state.alloc.small)/100 + (state.alloc.feq+state.alloc.feqh)/100*0.7;
    if(beta>state.sitThresholds.marginBeta && state.capital<state.sitThresholds.marginCapital){state.triggeredSituational.margin=true;return 'margin';}
}
return null;}

function renderSituationalEvent(id){
const ev=SIT_EVENTS[id];
const c=document.getElementById('scene-container');const a=document.getElementById('action-container');
c.innerHTML=`<h2 class="text-2xl font-bold text-red-400 mb-2">⚡ ${ev.title}</h2>
<div class="dialogue-box text-slate-300 leading-relaxed whitespace-pre-line" style="border-left-color:#ef4444;">${ev.narrative}</div>`;
let html='<div class="grid gap-3">';
ev.choices.forEach((ch,i)=>{html+=`<button onclick="resolveSituational('${id}',${i})" class="text-left bg-slate-800 hover:bg-slate-700 border border-red-500/40 hover:border-red-400 text-slate-200 font-medium py-4 px-6 rounded transition">${ch.label}</button>`;});
html+='</div>';
a.innerHTML=html;}

function resolveSituational(id,idx){SIT_EVENTS[id].choices[idx].apply();nextScene();}

function calcReturn(q,allocObj){allocObj=allocObj||state.alloc;let r=0;const sc=state.eventScen[q]||SCEN[q];for(let k in allocObj){const w=allocObj[k]/100;const a=AP[k];let ret=a.dur>0?a.cou-a.dur*sc.dy:sc.rfq+a.beta*sc.mkt+a.s*sc.smb+a.h*sc.hml+a.fx*sc.fx+(a.fp?sc.fp:0);r+=w*ret;}return r;}

function handleSelect(i){
const scene=scenes[state.sceneIndex];const sel=scene.options[i];
const fb=document.getElementById('quiz-feedback');const nb=document.getElementById('next-btn');
document.querySelectorAll('#action-container button:not(#next-btn)').forEach(b=>{b.disabled=true;b.classList.add('opacity-50','cursor-not-allowed');});

else{fb.className="mt-4 p-4 rounded bg-red-900/30 border border-red-500 text-red-300 fade-in";fb.innerHTML=`<strong class="text-red-400">✗ Incorrect.</strong> ${sel.feedback}`;}
const totalQ=scenes.filter(s=>['quiz','email'].includes(s.type)).length;
document.getElementById('score-display').innerText=Math.round((state.correctCount/totalQ)*100);
nb.classList.remove('hidden');}

function renderChart(id,cfg){
const ex=Chart.getChart(id);if(ex)ex.destroy();
const ctx=document.getElementById(id).getContext('2d');const d=[];
for(let i=0;i<60;i++){const x=(Math.random()-0.5)*20;const rs=Math.sqrt((1-cfg.rSquared)*100);const r=(Math.random()-0.5)*2*rs;const y=(cfg.alphaIsPositive?2:0)+cfg.beta*x+r;d.push({x:parseFloat(x.toFixed(2)),y:parseFloat(y.toFixed(2))});}
const ld=cfg.alphaIsPositive?[{x:-10,y:-10*cfg.beta+2},{x:10,y:10*cfg.beta+2}]:[{x:-10,y:-10*cfg.beta},{x:10,y:10*cfg.beta}];
new Chart(ctx,{type:'scatter',data:{datasets:[{label:'Observations',data:d,backgroundColor:cfg.alphaIsPositive?'rgba(91,140,255,0.6)':'rgba(255,193,7,0.6)',pointRadius:3},{label:'SCL',data:ld,type:'line',borderColor:cfg.alphaIsPositive?'#5b8cff':'#ffc107',borderWidth:2,pointRadius:0,fill:false}]},
options:{responsive:true,maintainAspectRatio:false,scales:{x:{title:{display:true,text:'Market Excess Return',color:'#94a3b8'},grid:{color:'#334155'},ticks:{color:'#94a3b8'}},y:{title:{display:true,text:'Asset Excess Return',color:'#94a3b8'},grid:{color:'#334155'},ticks:{color:'#94a3b8'}}},plugins:{legend:{display:true,labels:{color:'#e8eaf6'}}}}});}

function openAttachment(id) {
    const att = ATTACHMENTS[id];
    document.getElementById('att-modal-title').innerHTML = ` <span>${att.filename}</span>`;
    document.getElementById('attachment-modal').classList.add('active');
    setTimeout(() => {
        if (att.isDual) {
            const body = document.getElementById('att-modal-body');
            body.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-full">
                <div class="bg-slate-900 p-2 rounded flex flex-col"><p class="text-center text-xs mb-2 text-slate-400">Stock A Regression</p><div class="chart-container flex-grow"><canvas id="modalChartA"></canvas></div></div>
                <div class="bg-slate-900 p-2 rounded flex flex-col"><p class="text-center text-xs mb-2 text-slate-400">Stock B Regression</p><div class="chart-container flex-grow"><canvas id="modalChartB"></canvas></div></div>
            </div>`;
            renderChart('modalChartA', att.configA);
            renderChart('modalChartB', att.configB);
        } else {
            const body = document.getElementById('att-modal-body');
            body.innerHTML = `<div class="chart-container" style="height: 350px;"><canvas id="modalChart"></canvas></div>`;
            renderChart('modalChart', att.config);
        }
    }, 100);
}

function closeAttachment() {
    document.getElementById('attachment-modal').classList.remove('active');
    ['modalChart', 'modalChartA', 'modalChartB'].forEach(id => {
        const ex = Chart.getChart(id);
        if(ex) ex.destroy();
    });
}
